name: Release

# Автоматический релиз: при пуше тега вида v1.2.3 / v1.2.3-rc.1
# создаёт GitHub Release с автогенерируемыми заметками (merged PR + commits).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # gh release create пишет в репозиторий

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # полная история — нужна для генерации заметок

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_REF_NAME = имя тега (например v0.3.0)
          # --generate-notes — заметки из PR и коммитов между прошлым релизом и тегом
          # --latest — отметить как последний релиз
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --latest
